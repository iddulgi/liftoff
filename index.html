<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CalmWave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: phone-sized stage; home feed of overlapping curved cards, full-screen player slides up over it. Dark, single look. */
:root{
  --ink:#06080f; --ink2:#0d1220; --fg:#eef1f8; --fg2:#a7afc4; --line:rgba(255,255,255,.12);
  --glass:rgba(18,22,38,.55); --accent:#aab0bd; --theme:#8fd3c9;
  --display:'Inter','Noto Sans KR',system-ui,sans-serif; --body:'Inter','Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.phone{position:relative;width:100%;height:100%;max-width:430px;max-height:900px;overflow:hidden;background:var(--ink)}
@media (min-width:520px) and (min-height:760px){.phone{height:min(100%,860px);border-radius:44px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}

/* HOME */
.home{position:absolute;inset:0;z-index:0;isolation:isolate;display:flex;flex-direction:column}
.homebg{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.homebg.on{opacity:1}
.hdr{position:absolute;top:0;left:0;right:0;z-index:30;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 10px;gap:10px}
.hbtn{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);display:grid;place-items:center;position:relative}
#hWave{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none} /* status icon only: no circle, not tappable */
.wave{display:flex;gap:2px;align-items:center;height:22px} /* six thin bars, proportions taken from the iOS now-playing icon */
.wave i{width:2.5px;border-radius:2px;background:var(--fg2);opacity:.5;height:var(--h);transition:background .3s,opacity .3s}
.wave i:nth-child(1){--h:12.5px;--hp:12.5px}.wave i:nth-child(2){--h:22px;--hp:22px}.wave i:nth-child(3){--h:20px;--hp:20px}.wave i:nth-child(4){--h:13.2px;--hp:13.2px}.wave i:nth-child(5){--h:11px;--hp:11px}.wave i:nth-child(6){--h:17.6px;--hp:17.6px}
.playing .wave i{background:var(--theme);opacity:1;height:var(--hp)} /* while playing, script sets each bar's height from the music */
.stat{flex:1;min-width:0;height:42px;border-radius:21px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--fg2)}
.stat b{font-family:var(--display);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#ff7a7a;color:#1a0707;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.feed{position:relative;z-index:2;flex:1;overflow-y:auto;padding:0 0 150px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.noenter .enter{animation:none!important}
.feedhead{padding:6px 24px 18px}
.feedhead h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em}
.feedhead p{margin:4px 0 0;color:var(--fg2);font-size:14px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:340px;overflow:hidden;margin:0;padding:0 26px;transition:transform .25s}
.card:first-child{height:380px;padding-top:50px}
.card:active{transform:scale(.985)}
.card .bgc{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
.card .shade{position:absolute;inset:0;z-index:1;background:radial-gradient(70% 45% at 50% 52%,rgba(0,0,0,.28),transparent 80%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35))}
.card>*:not(.bgc):not(.shade){position:relative;z-index:2}
.card .kind{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.card h2{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-.02em;margin:8px 0 2px;text-wrap:balance}
.card .sub{font-size:14px;color:rgba(255,255,255,.88);font-weight:400;letter-spacing:.02em}
.card .kind{margin-bottom:2px}
.card .go{position:absolute!important;right:22px;bottom:50px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);display:grid;place-items:center}
.card.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.nav{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;padding:5px;border-radius:30px;background:rgba(14,18,32,.72);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.nav .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:25px;background:var(--accent);transition:transform .45s cubic-bezier(.5,1.4,.5,1),background .6s}
.nav button{position:relative;z-index:1;width:92px;height:46px;border-radius:25px;font-size:14px;font-weight:500;color:var(--fg2);transition:color .3s;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button[aria-selected=true]{color:#06121a}
.mini{position:absolute;z-index:7;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding:10px 12px 10px 10px;border-radius:36px;background:var(--glass);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:space-between;gap:16px}
.mini.show{display:flex}
.mtext{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mtx{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}

.mt{font-family:var(--display);font-weight:160;font-size:16px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;color:#fff}
.mt.swap{animation:swapt .4s ease}
@keyframes swapt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mt,.mc{transition:color .3s}
.playing .mt{color:var(--theme)}
.playing .mc{color:var(--theme);opacity:.75}
.mc{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.mctl{display:flex;align-items:center;gap:4px;flex:none}
.mbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.mdisc{width:42px;height:42px;border-radius:50%;flex:none;display:block}
.mdisc .disc{width:42px;height:42px;margin:0;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.mdisc .art::after{display:none}


.tbtn{position:absolute;z-index:31;left:10px;top:calc(env(safe-area-inset-top,0px) + 70px);font-size:10px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;padding:4px 8px;backdrop-filter:blur(8px)}
.feed.cdlist{background:#000;padding:90px 0 100px;display:flex;flex-direction:column;align-items:center;gap:0}
.phone{container-type:inline-size}
.cdlist .disc{width:240px;height:240px;flex:none;margin:0 0 20px;scroll-snap-align:center;transition:transform .25s}
.cdlist .disc:active{transform:scale(.97)}
.cmeta .ct,.cmeta .cs{transition:color .3s}
.cmeta.on .ct{color:var(--theme)}
.cmeta.on .cs{color:var(--theme);opacity:.75}
.cmeta{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.cdi{display:flex;flex-direction:column;align-items:center;flex:none;margin-bottom:34px;will-change:transform,opacity}
.disc{position:relative;display:block;width:min(64vw,250px);aspect-ratio:1;border-radius:50%;box-shadow:none;margin-bottom:12px}
.disc .art,.disc .sheen{position:absolute;inset:0;border-radius:50%}
.disc .art{background-size:cover;background-position:center}
.disc .sheen{background:conic-gradient(from 20deg,rgba(255,255,255,.22),transparent 18%,rgba(255,255,255,.12) 40%,transparent 58%,rgba(255,255,255,.2) 78%,transparent);mix-blend-mode:soft-light}
.disc .hole{position:absolute;left:50%;top:50%;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 0 5px rgba(255,255,255,.28)}
.disc .pbadge{position:absolute;right:2%;bottom:6%;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.disc.spin .art,.disc.spin .sheen{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ct{font-family:var(--display);font-weight:700;font-size:15px;color:#fff}
.cs{font-size:12px;color:#8a90a3}

.feed.decklist{--WT:min(calc(100cqw - 20px),360px);--W:min(calc(100cqw - 64px),380px);--WB:calc((2 * var(--W) + 312px) / 3 - 20px);background:#000;padding:90px 0 100px;overflow-x:hidden}  /* --WT: player card width; --W: width of the CD list area; --WB: width from the first CD's left edge to the third CD's right edge, used for the time bar and controls, pulled 10px in on each side */
.deck{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 24px}
.tray{width:var(--WT);aspect-ratio:1;border-radius:48px;background:linear-gradient(430deg,#0a0a0a,#0e0e0e);border:1px solid rgba(255,255,255,.05);box-shadow:inset 1px 0 rgba(255,255,255,.10);display:grid;place-items:center;margin-bottom:0;position:relative}
.tray{background:none;border:0;box-shadow:none} /* TEMP: card look hidden to compare. To bring it back, delete this line (the original background, border and shadow are kept in the rule above) */
.deck{position:relative;z-index:0}
.dglow{position:absolute;left:0;right:0;top:-90px;height:640px;z-index:-1;pointer-events:none;animation:dglowin .6s ease both;
  background:linear-gradient(180deg,rgba(var(--g),.42) 0%,rgba(var(--g),.2) 38%,rgba(var(--g),.07) 68%,rgba(var(--g),0) 100%)} /* soft wash of the CD's main colour behind the player */
@keyframes dglowin{from{opacity:0}to{opacity:1}}
.bigslot{width:84%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;outline-offset:4px}
.bigslot .disc{width:100%;margin:0;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.045)}
.dtitle{font-family:var(--display);font-weight:700;font-size:20px}
.dsub{font-size:12px;color:#8a90a3}
.dprog{width:var(--WB);margin-top:20px}
.dbar{height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.dbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--theme);transition:width .5s linear,background .4s} /* same colour as the header wave icon */
.dtimes{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.dctl{margin-top:12px;width:var(--WB);position:relative;display:flex;align-items:center;justify-content:center;gap:30px}
#dshuf,#drep{position:absolute;top:50%;margin-top:-18px}
#dshuf{left:-9px}   /* icon ink starts exactly at the bar's left end */
#drep{right:-10.4px} /* ...and ends at its right end */
.dopt{width:36px;height:36px;display:grid;place-items:center;flex:none;color:rgba(255,255,255,.4);position:relative;transition:color .2s}
.dopt[aria-pressed=true]{color:#fff}
.dsk{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.dbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);border:0;display:grid;place-items:center}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 12px;width:var(--W);margin:0 auto;padding:48px 0 0;justify-items:center}

.sd{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
.sd .disc{width:min(24vw,96px);margin:0;box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14)}
.sd:active .disc{transform:scale(.94)}
.sl{font-size:11px;color:#8a90a3;text-align:center}
.fly{position:absolute;z-index:60;pointer-events:none;transform-origin:center}
.fly .disc{width:100%;margin:0;box-shadow:0 18px 40px rgba(0,0,0,.7)}
.disc.gorb .art{overflow:hidden;filter:saturate(1.05);isolation:isolate;-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%)}
.disc.gorb{-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%)}
.disc.gorb .art::after,.bgc::after{content:"";position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:soft-light;opacity:.75;
  background:radial-gradient(40% 40% at 30% 30%,rgba(255,255,255,.55),transparent 70%),radial-gradient(45% 45% at 72% 68%,rgba(120,210,255,.5),transparent 70%),radial-gradient(35% 35% at 70% 25%,rgba(255,150,210,.45),transparent 70%);
  animation:wash 7s ease-in-out infinite alternate}
.cdi:nth-child(odd) .art::after,.sd:nth-child(odd) .art::after,.card:nth-child(even) .bgc::after{animation-delay:-3.5s}
.cc .art::after,.ai .art::after{display:none}
@keyframes wash{from{transform:translate(-9%,-7%) rotate(0deg) scale(1)}to{transform:translate(9%,7%) rotate(50deg) scale(1.18)}}
.disc.gorb .sheen,.disc.gorb .hole{display:none}
.disc.gorb .art.photo{background-size:cover,cover;background-position:center,center;background-repeat:no-repeat;-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 3.5%,#000 3.8%);mask-image:radial-gradient(circle at 50% 50%,transparent 3.5%,#000 3.8%)}
.disc.gorb{box-shadow:none}
.hl{display:flex;align-items:center;gap:8px}
#calBtn{display:none} /* calendar hidden for now: remove this line to bring the button (and the whole calendar) back */
.cal{position:absolute;inset:0;z-index:20;background:#0b0d12;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:0 6px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.cal.open{transform:none}
.calhd{display:flex;padding:0 10px;margin-bottom:10px}
.calhead{position:sticky;top:0;z-index:5;background:#0b0d12;padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
.calbig{padding:0 20px 40px}
.calbig span{display:block;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;font-size:84px;font-weight:700;line-height:.95;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.cdow,.cgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.cdow span{text-align:center;font-size:12px;color:var(--fg2);padding-bottom:10px}
.cmon{height:var(--mh,520px);scroll-snap-align:start}
.cgrid{height:100%;grid-template-rows:repeat(var(--rows,6),1fr)}
.cal:not(.agenda){scroll-snap-type:y mandatory;scroll-padding-top:var(--hh,220px)}
.cc{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:0}
.cc .n{position:relative;z-index:2;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;font-size:16px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.cc.has .n{color:#0b0d12;font-weight:700}
.cc .disc{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:0;transform:translate(-50%,-50%);box-shadow:none}
.cc .disc .hole,.cc .disc .sheen{display:none}
.cc.sel::after{content:"";position:absolute;inset:1%;border-radius:50%;border:2px solid #fff;z-index:4}
.cagenda{display:none;flex-direction:column;padding-bottom:20px}
.cal.agenda #cmonths,.cal.agenda .cdow{display:none}
.cal.agenda .cagenda{display:flex}
.cal.agenda .calbig{padding-bottom:20px}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);border-radius:0;padding:0 8px 0 14px;height:96px;scroll-margin-top:150px}
.arow .an{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;font-size:64px;font-weight:300;line-height:1;color:#fff;min-width:80px;font-variant-numeric:tabular-nums}
.aitems{flex:1;min-width:0;display:flex;justify-content:flex-end;padding-left:20px}
.ai{display:block;position:relative;margin-left:-22px;flex:none}
.ai:first-child{margin-left:0}
.ai .disc{position:relative;width:44px;height:44px;margin:0;box-shadow:0 0 0 1px #0b0d12}
.dnote{font-size:11px;color:#6c7488;text-align:center;padding:6px 0 0}
.mback{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .4s}
.mback.open{opacity:1;pointer-events:auto}
.sheet.msheet{z-index:26;max-height:80%;background:rgba(18,20,28,.72);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.msheet .grab{margin:0 auto 14px;padding:0;cursor:grab;touch-action:none}
.mshead{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.mshead b{font-size:16px;font-weight:600}.mshead span{font-size:12px;color:var(--fg2)}
.msheet h3{margin:20px 0 10px}
.msheet .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.msheet .chip[aria-pressed=true]{background:#fff;color:#0a0f1a}
/* PLAYER */
.player{position:absolute;inset:0;z-index:20;transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);background:#000;overflow:hidden}
.player.open{transform:none}
.pbg{position:absolute;inset:-5%;background-size:cover;background-position:center;animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translateX(0)}to{transform:scale(1.1) translateX(-2%)}}
.player canvas{position:absolute;inset:0;width:100%;height:100%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55));pointer-events:none}
.dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 2s;pointer-events:none;z-index:6}
.dim.on{opacity:.72}
.ptop{position:absolute;z-index:4;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0}
.pmid{position:absolute;z-index:4;left:0;right:0;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 28px;gap:22px}
.playbtn{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(14px);display:grid;place-items:center;transition:transform .2s,background .3s;box-shadow:0 0 0 0 rgba(255,255,255,.25)}
.playbtn:active{transform:scale(.94)}
.on-air .playbtn{animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}50%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.ptitle{font-family:var(--display);font-size:30px;font-weight:700;margin:0;letter-spacing:-.02em;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.pcopy{margin:6px 0 0;font-weight:300;font-style:italic;font-size:16px;color:rgba(255,255,255,.85)}
.pcr{position:absolute;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);text-align:center;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.04em}
.timerbox{position:absolute;z-index:4;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;align-items:center;gap:12px}
.count{font-family:var(--display);font-size:38px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chips{display:flex;gap:8px}
.chip{height:36px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);font-size:13px;color:rgba(255,255,255,.8);transition:all .25s}
.chip[aria-pressed=true]{background:#fff;color:#0a0f1a;border-color:#fff}
.handle{position:absolute;z-index:5;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 64px);display:flex;justify-content:center;align-items:flex-start;padding-top:10px}
.handle button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.7)}
.handle i{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.sheet{position:absolute;z-index:10;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:rgba(12,15,28,.9);backdrop-filter:blur(26px);border-top:1px solid var(--line);padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);max-height:78%;overflow-y:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 16px}
.sheet h3{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);margin:18px 0 10px;font-weight:500}
.sheet h3:first-of-type{margin-top:0}
.nomusic{color:var(--fg2);font-size:14px;padding:10px 0 18px}
.layer{display:grid;grid-template-columns:70px 1fr 38px;gap:12px;align-items:center;height:40px;font-size:14px}
.layer output{font-size:12px;color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--v,0%),rgba(255,255,255,.16) var(--v,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;font-size:14px}
.row small{display:block;color:var(--fg2);font-size:12px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.breathe{display:block;width:100%;height:52px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:15px;margin-top:6px}

/* BREATH */
.breath{position:absolute;z-index:30;inset:0;background:rgba(3,5,12,.82);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.breath.show{display:flex}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 45%,rgba(255,255,255,0) 72%);box-shadow:0 0 80px var(--accent);transform:scale(.55)}
.bt{font-family:var(--display);font-size:26px;min-height:34px}
.bs{font-size:13px;color:var(--fg2);margin-top:-22px;font-variant-numeric:tabular-nums}
.xbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px}
.toast{position:absolute;z-index:40;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);background:#fff;color:#0a0f1a;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:all .4s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

const step=d=>{const i=cur?ALL.findIndex(a=>a.id===cur.id):(layout==='deck'?deckIdx:-1);if(i<0)return;const n=shuffleOn&&d!==0?rndOther(ALL.length,i):(i+d+ALL.length)%ALL.length;buzz(10);openTheme(ALL[n],n,true);
  if(layout==='deck'){deckIdx=n;shelf=[];renderFeed()}}; // keep the big disc in sync when the CD changes from here or from the lock screen
$('#mnext').onclick=()=>step(1);
$('#close').onclick=()=>{$('#player').classList.remove('open');updateMini()};
function openPlayer(){if(cur){$('#player').classList.add('open');poke()}}
// Entering CD player mode (mini player tap, or the CD button): the disc grows from where it was (the mini player's disc,
// else that CD's disc in the list, else the bottom of the screen) into the big disc while the rest of the screen rises from below
function goDeck(){
  const ph=$('#phone').getBoundingClientRect(), md=$('#mdisc .disc');
  const idx=cur?ALL.findIndex(a=>a.id===cur.id):deckIdx;
  let from=null;
  if(cur&&md&&$('#mini').classList.contains('show'))from=md.getBoundingClientRect();
  else{const el=document.querySelector(`.cdlist .disc[data-i="${idx}"]`);if(el){const r=el.getBoundingClientRect();if(r.bottom>ph.top+40&&r.top<ph.bottom-40)from=r}}
  if(!from)from={left:ph.left+ph.width/2-21,top:ph.bottom-96,width:42,height:42};
  layout='deck';deckIdx=idx;shelf=[];renderFeed();buzz(10);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const big=$('#bigdisc'),ease='cubic-bezier(.2,.8,.2,1)';
  if(big){const to=big.getBoundingClientRect(),dx=from.left+from.width/2-(to.left+to.width/2),dy=from.top+from.height/2-(to.top+to.height/2);
    big.animate([{transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width})`},{transform:'none'}],{duration:560,easing:ease})}
  [...document.querySelectorAll('.deck > :not(.tray):not(.dglow), .shelf')].forEach((el,i)=>el.animate([{transform:'translateY(90px)',opacity:0},{transform:'none',opacity:1}],{duration:520,delay:70+i*35,easing:ease,fill:'backwards'}));
  $('.tray')&&$('.tray').animate([{opacity:0},{opacity:1}],{duration:300,fill:'backwards'})}
$('#mtext').onclick=()=>{if(cur)goDeck()};
// CD player progress bar: elapsed and remaining time of the whole CD (all its tracks), updated with the mini player
const mss=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
function updateDeckBar(){
  const f=$('#dfill');if(!f||layout!=='deck')return;
  const it=ALL[deckIdx],total=trackList(it).reduce((a,t)=>a+(t.d||0),0);
  let rem=total;if(cur&&cur.id===it.id){const r=cdRemaining();if(r!=null)rem=Math.min(total,r)}
  const done=total?total-rem:0;
  f.style.width=(total?Math.min(100,done/total*100):0).toFixed(2)+'%';
  $('#dtl').textContent=mss(done);$('#dtr').textContent='-'+mss(rem)}
let miniId=null, trackSec=0;
function updateMini(){const m=$('#mini');m.classList.toggle('show',!!cur&&!$('#player').classList.contains('open')&&layout!=='deck');
  if(cur&&cur.id!==miniId){miniId=cur.id;trackSec=0;$('#mdisc').innerHTML=discHTML(cur,'gorb'+(playing?' spin':''),false)}
  if(cur){const t=$('#miniT'),tt=cur.t;if(t.textContent!==tt){t.textContent=tt;t.classList.remove('swap');void t.offsetWidth;t.classList.add('swap')}}
  {const rem=cdRemaining();$('#miniC').textContent=rem==null?'--:--':'-'+fmt(rem)}
  updateDeckBar();if(cur){$('#mstitle').textContent=cur.t;$('#mssub').textContent=cur.mode+' · '+cur.sub}}
new MutationObserver(updateMini).observe($('#player'),{attributes:true,attributeFilter:['class']});

/* timer */
setInterval(()=>{
  if(!playing)return; const now=Date.now(), dt=(now-lastTick)/1000; lastTick=now;
  listened+=dt; trackSec+=dt; logListen(dt); if(Math.floor(listened)%5===0){try{localStorage.setItem('cw_listen',listened)}catch(e){}}
  updateMini();
},500);

/* sheet + mixer */
function buildLayers(){
  $('#layers').innerHTML=!(cur&&cur.music)?'<div class="nomusic">이 CD에는 아직 음악이 없어요</div>':LAYERS.map(([k,n])=>`<div class="layer"><label for="r_${k}">${n}</label><input type="range" id="r_${k}" min="0" max="100" value="${mix[k]||0}" style="--v:${mix[k]||0}%"><output id="o_${k}">${mix[k]||0}</output></div>`).join('');
  $$('#layers input').forEach(r=>r.oninput=()=>{const k=r.id.slice(2);mix[k]=+r.value;r.style.setProperty('--v',r.value+'%');$('#o_'+k).textContent=r.value;applyMix(false);poke()});
}

/* idle dimming (battery saver) */
let idle; function poke(){$('#dim').classList.remove('on');clearTimeout(idle);if(dimOn)idle=setTimeout(()=>{if(playing&&$('#player').classList.contains('open'))$('#dim').classList.add('on')},6000)}
['pointerdown','pointermove','keydown'].forEach(ev=>$('#player').addEventListener(ev,poke,{passive:true}));
$('#bat').onclick=()=>{$('#dim').classList.add('on')};
$('#dim').style.pointerEvents='none';

/* ---------- Visual scenes (canvas stand-in for looping cinematic video) ---------- */
const cv=$('#cv'), g2=cv.getContext('2d'); let scene=null,W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width||1;H=r.height||1;cv.width=W*d;cv.height=H*d;g2.setTransform(d,0,0,d,0,0);if(cur)scene=makeScene(cur)}
function makeScene(it){
  const n=it.scene, o={it,n,p:[]};
  const cnt=n==='rain'?160:n==='stars'?140:n==='embers'?60:0;
  for(let i=0;i<cnt;i++)o.p.push({x:Math.random()*W,y:Math.random()*H,v:.4+Math.random(),r:Math.random(),ph:Math.random()*6.28});
  return o;
}
function frame(t){
  requestAnimationFrame(frame);
  if(!scene||!$('#player').classList.contains('open')||!W)return;
  const {it,n,p}=scene, [a,b,c]=it.c, k=playing?1:.35, tt=t*.001;
  g2.globalCompositeOperation='source-over';
  g2.clearRect(0,0,W,H);
  g2.globalCompositeOperation='lighter';
  for(let i=0;i<0;i++){
    const x=W*(.5+.38*Math.sin(tt*.13*(i+1)+i*2.1)), y=H*(.32+.22*Math.cos(tt*.1*(i+1.3)+i)), r=W*(.8+.2*Math.sin(tt*.2+i));
    const gr=g2.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(i===1?c:a,.42*(n==='mist'?1.2:.8)));gr.addColorStop(1,rgba(a,0));
    g2.fillStyle=gr;g2.fillRect(0,0,W,H);
  }
  if(n==='rain'){
    g2.strokeStyle=rgba(c,.5);g2.lineWidth=1;g2.beginPath();
    for(const d of p){d.y+=(9+d.v*14)*k;d.x-=1.2*k;if(d.y>H){d.y=-20;d.x=Math.random()*W*1.1}
      g2.moveTo(d.x,d.y);g2.lineTo(d.x+1.2,d.y-(10+d.v*16))}
    g2.stroke();
  }else if(n==='stars'){
    for(const d of p){const tw=.4+.6*Math.abs(Math.sin(tt*(.4+d.v*.5)+d.ph));g2.fillStyle=rgba([220,226,255],tw*.9);g2.beginPath();g2.arc(d.x,(d.y+tt*2*d.v)%H,.5+d.r*1.4,0,6.28);g2.fill()}
  }else if(n==='embers'){
    for(const d of p){d.y-=(.3+d.v*1.1)*k;d.x+=Math.sin(tt*1.5+d.ph)*.4;if(d.y<-10){d.y=H+10;d.x=W*(.2+.6*Math.random())}
      const al=Math.min(1,(H-d.y)/H*1.6)*.9;const gr=g2.createRadialGradient(d.x,d.y,0,d.x,d.y,6+d.r*8);gr.addColorStop(0,rgba(c,al));gr.addColorStop(1,rgba(c,0));g2.fillStyle=gr;g2.fillRect(d.x-16,d.y-16,32,32)}
  }else if(n==='__'){
    g2.globalCompositeOperation='source-over';
    for(let w=0;w<4;w++){const base=H*(.62+w*.08);g2.beginPath();g2.moveTo(0,H);
      for(let x=0;x<=W;x+=10)g2.lineTo(x,base+Math.sin(x*.012+tt*(.5+w*.15)+w)*(10+w*5)*(playing?1:.5));
      g2.lineTo(W,H);g2.closePath();g2.fillStyle=rgba(w%2?a:c,.14+w*.04);g2.fill()}
  }
  g2.globalCompositeOperation='source-over';
}
requestAnimationFrame(frame);
window.addEventListener('resize',resize);


/* ---------- Listening calendar ---------- */
let hist={}; try{hist=JSON.parse(localStorage.getItem('cw_hist')||'{}')||{}}catch(e){}
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let histSave=0;
function logListen(dt){if(!cur)return;const k=dkey(new Date());const day=hist[k]||(hist[k]={});day[cur.id]=(day[cur.id]||0)+dt;
  if(Date.now()-histSave>4000){histSave=Date.now();try{localStorage.setItem('cw_hist',JSON.stringify(hist))}catch(e){}}}
// sample entries are shown only while there is no real history, so the calendar is not empty the first time
function demoHist(y,m){const o={},R=rngf(y*12+m),ids=ALL.map(a=>a.id);
  for(let d=1;d<=31;d++){if(R()<.62){const day={},n=1+Math.floor(R()*3);for(let i=0;i<n;i++)day[ids[Math.floor(R()*ids.length)]]=(10+Math.floor(R()*60))*60*(i?0.5:1);o[`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`]=day}}
  return o}
const now0=new Date(); let vy=now0.getFullYear(), vm=now0.getMonth(), selDay=null;
const realEmpty=()=>!Object.keys(hist).length;
const pad2=n=>String(n).padStart(2,'0');
const dayIds=(data,k)=>{const day=data[k];return day?Object.keys(day).filter(id=>ALL.some(a=>a.id===id)).sort((a,b)=>day[b]-day[a]):[]};
// every month sits in one long scroll (earlier months above, the current month at the bottom); the big number follows the month in view
function renderMonths(){
  const tk=dkey(new Date()), empty=realEmpty(); let out='';
  for(let i=11;i>=0;i--){const dt=new Date(now0.getFullYear(),now0.getMonth()-i,1),y=dt.getFullYear(),m=dt.getMonth(),first=dt.getDay(),dim=new Date(y,m+1,0).getDate(),data=empty?demoHist(y,m):hist;
    let h='<span></span>'.repeat(first);
    for(let d=1;d<=dim;d++){const k=`${y}-${pad2(m+1)}-${pad2(d)}`,ids=dayIds(data,k),it=ids.length&&ALL.find(a=>a.id===ids[0]);
      h+=`<button class="cc${it?' has':''}${k===tk?' today':''}" data-k="${k}" aria-label="${m+1}월 ${d}일${it?' · '+ids.length+'개 청취':''}">${it?discHTML(it,'gorb',false):''}<span class="n">${d}</span></button>`}
    out+=`<section class="cmon" data-m="${pad2(m+1)}" aria-label="${y}년 ${m+1}월"><div class="cgrid" style="--rows:${Math.ceil((first+dim)/7)}">${h}</div></section>`}
  $('#cmonths').innerHTML=out;$('#calMonth').textContent=pad2(now0.getMonth()+1);sizeMonths();
}
// one month = one full page under the sticky month number
function sizeMonths(){const c=$('#cal'),hh=$('.calhead').offsetHeight;if(!hh)return;c.style.setProperty('--hh',hh+'px');c.style.setProperty('--mh',(c.clientHeight-hh-18)+'px')}
window.addEventListener('resize',sizeMonths);
function renderAgenda(){
  const empty=realEmpty(), data=empty?demoHist(vy,vm):hist, dim=new Date(vy,vm+1,0).getDate(), tk=dkey(new Date());
  let ag='';
  for(let d=1;d<=dim;d++){const k=`${vy}-${pad2(vm+1)}-${pad2(d)}`,ids=dayIds(data,k),day=data[k];
    ag+=`<button class="arow${ids.length?'':' none'}${k===tk?' today':''}${k===selDay?' sel':''}" data-k="${k}" aria-label="${vm+1}월 ${d}일, 달력으로 돌아가기"><span class="an">${d}</span>${ids.length?`<span class="aitems">${ids.map((id,n)=>{const t=ALL.find(a=>a.id===id);return `<span class="ai" style="z-index:${ids.length-n}" title="${t.t} · ${Math.max(1,Math.round(day[id]/60))}분">${discHTML(t,'gorb',false)}</span>`}).join('')}</span>`:''}</button>`}
  $('#cagenda').innerHTML=ag+(empty?'<div class="dnote">지금 보이는 기록은 샘플입니다. 직접 음악을 들으면 실제 기록으로 바뀝니다.</div>':'');
  $('#calMonth').textContent=pad2(vm+1);
}
let monthsTop=0, monthRaf=0;
function syncMonth(){monthRaf=0;const c=$('#cal');if(c.classList.contains('agenda'))return;
  const line=c.getBoundingClientRect().top+$('.calhead').offsetHeight+4;let cur='';
  for(const el of c.querySelectorAll('.cmon')){if(el.getBoundingClientRect().top<=line)cur=el.dataset.m;else break}
  if(cur&&$('#calMonth').textContent!==cur)$('#calMonth').textContent=cur}
$('#cal').addEventListener('scroll',()=>{if(!monthRaf)monthRaf=requestAnimationFrame(syncMonth)},{passive:true});
function setAgenda(on,k){const c=$('#cal');
  if(on){monthsTop=c.scrollTop;selDay=k;vy=+k.slice(0,4);vm=+k.slice(5,7)-1;renderAgenda();c.classList.add('agenda');const r=$(`.arow[data-k="${k}"]`);c.scrollTop=r?Math.max(0,r.offsetTop-$('.calhead').offsetHeight):0}
  else{selDay=null;c.classList.remove('agenda');c.scrollTop=monthsTop;syncMonth()}buzz(8)}
function setCal(on){const c=$('#cal');c.classList.remove('agenda');if(on){selDay=null;renderMonths();c.scrollTop=c.scrollHeight;requestAnimationFrame(()=>{sizeMonths();c.scrollTop=c.scrollHeight})}c.classList.toggle('open',on);c.setAttribute('aria-hidden',!on);buzz(8)}
$('#calBtn').onclick=()=>setCal(!$('#cal').classList.contains('open'));
$('#cmonths').onclick=e=>{const c=e.target.closest('.cc');if(c)setAgenda(true,c.dataset.k)};
$('#cagenda').onclick=e=>{if(e.target.closest('.arow'))setAgenda(false)};


/* ---------- Bottom sheet: timer, presets, mixer, settings ---------- */
function setSheet(on){if(on&&!cur){toast('재생 중인 소리가 없어요');return}$('#msheet').classList.toggle('open',on);$('#mback').classList.toggle('open',on);$('#msheet').setAttribute('aria-hidden',!on);if(on)buzz(8)}
function openPlayer(){setSheet(true)}
$('#mback').onclick=()=>setSheet(false);
(function(){const g=$('#mgrab'),sh=$('#msheet');let y0=null;
  const end=dy=>{sh.style.transition='';sh.style.transform='';y0=null;if(dy>70)setSheet(false)};
  g.addEventListener('pointerdown',e=>{y0=e.clientY;sh.style.transition='none';g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(y0===null)return;const dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
  g.addEventListener('pointerup',e=>{if(y0!==null)end(e.clientY-y0)});g.addEventListener('pointercancel',()=>end(0));
  g.addEventListener('click',()=>{if(sh.classList.contains('open')&&y0===null&&!sh.style.transform)setSheet(false)});
})();


/* ---------- Lock screen / control centre (Media Session) ---------- */
const artCache={};
function coverPNG(it){return new Promise(res=>{if(artCache[it.id])return res(artCache[it.id]);
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const k=Math.max(512/img.width,512/img.height),w=img.width*k,h=img.height*k;c.getContext('2d').drawImage(img,(512-w)/2,(512-h)/2,w,h);c.toBlob(b=>{if(!b)return res(null);artCache[it.id]=URL.createObjectURL(b);res(artCache[it.id])})};img.onerror=()=>res(null);img.src=PHOTO[it.id]?encodeURI(PHOTO[it.id]):coverURL(it).slice(5,-2)})}
function updateMediaSession(it){
  if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;
  const meta={title:curTitle()||it.t,artist:'CalmWave',album:it.t+' · '+it.sub};
  try{navigator.mediaSession.metadata=new MediaMetadata(meta)}catch(e){return}
  coverPNG(it).then(u=>{if(u&&cur&&cur.id===it.id){try{navigator.mediaSession.metadata=new MediaMetadata({...meta,artwork:[{src:u,sizes:'512x512',type:'image/png'}]})}catch(e){}}})}
if('mediaSession' in navigator){const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  set('play',()=>{if(!playing)setPlaying(true)});set('pause',()=>{if(playing)setPlaying(false)});set('nexttrack',()=>step(1));set('previoustrack',()=>step(-1))}

/* ---------- Header level bars: six bands of the music, bass on the left; each bar shrinks to a dot when its band is quiet ---------- */
const WAVE=[[1,2],[2,4],[4,8],[8,16],[16,40],[40,110]]; // fft bins of 86 Hz
const WBASE=[.28,.32,.55,.55,.38,.12];                    // resting height of each bar (middle bars tallest, like the reference)
let waveRaf=0, waveEls=null, waveBuf=null, waveSm=[.28,.32,.55,.55,.38,.12], wavePk=[40,40,40,40,40,40], waveMean=[-1,-1,-1,-1,-1,-1];
function waveTick(t){
  waveRaf=0; if(!playing)return;
  const els=waveEls||(waveEls=[...document.querySelectorAll('#hWave .wave i')]), MAX=22, DOT=2.5;
  let live=!!(ctx&&L.an&&musicEl&&musicEl.dataset.routed&&!musicEl.paused), target=null;
  if(live){const b=waveBuf||(waveBuf=new Uint8Array(L.an.frequencyBinCount));L.an.getByteFrequencyData(b);
    let top=0;target=WAVE.map(([a,z],i)=>{let m=0;for(let k=a;k<z;k++)m+=b[k];m/=(z-a);top=Math.max(top,m);
      wavePk[i]=Math.max(m,wavePk[i]*.997,20);                 // each band is normalised on its own, so a steady bass line cannot pin bar 1 at full height
      const v=m/wavePk[i];if(waveMean[i]<0)waveMean[i]=v;waveMean[i]+=(v-waveMean[i])*.04;     // slow average: the bar rests near its base height
      return Math.max(0,Math.min(1,WBASE[i]+2.4*(v-waveMean[i])))});  // and jumps up on every beat or note, dips below when its band goes quiet
    if(top<2)live=false}
  if(!live){const s=t/1000;target=WBASE.map((b,i)=>Math.max(0,Math.min(1,b+.4*Math.sin(s*(2.3+i*.6)+i*1.9)*Math.sin(s*(.8+i*.27)+i))))}
  els.forEach((e,i)=>{const k=target[i]>waveSm[i]?.6:.22;waveSm[i]+=(target[i]-waveSm[i])*k;e.style.height=(DOT+waveSm[i]*(MAX-DOT)).toFixed(1)+'px'});
  waveRaf=requestAnimationFrame(waveTick)}
function waveSync(){
  if(playing){if(!waveRaf){waveMean.fill(-1);wavePk.fill(40);waveRaf=requestAnimationFrame(waveTick)}}
  else{cancelAnimationFrame(waveRaf);waveRaf=0;(waveEls||[...document.querySelectorAll('#hWave .wave i')]).forEach(e=>e.style.removeProperty('height'))}}

/* ---------- boot ---------- */
$('#pp').innerHTML=ICON.play;
$('#bell').onclick=()=>{if($('#cal').classList.contains('open'))setCal(false);else nextLayout()};
renderFeed(); resize(); setTimeout(resize,100);
})();
</script>
