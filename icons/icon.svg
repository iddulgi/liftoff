<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- top (front) sphere: dark navy core sitting low, light cyan rim -->
    <radialGradient id="top" cx="0.5" cy="0.62" r="0.62" fx="0.5" fy="0.64" gradientTransform="translate(.5 .62) scale(1.28 .92) translate(-.5 -.62)">
      <stop offset="0" stop-color="#060c3a"/>
      <stop offset=".24" stop-color="#0b2088"/>
      <stop offset=".46" stop-color="#2557b8"/>
      <stop offset=".70" stop-color="#6aa6d8"/>
      <stop offset=".90" stop-color="#b7e0ec"/>
      <stop offset="1" stop-color="#d4f0f4"/>
    </radialGradient>
    <radialGradient id="topRim" cx="0.5" cy="0.10" r="0.5">
      <stop offset="0" stop-color="#e4f8fa" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#bfe6ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#bfe6ee" stop-opacity="0"/>
    </radialGradient>
    <!-- bottom (back) sphere: pale, a little deeper toward the bottom edge -->
    <radialGradient id="bot" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#dcf3f5"/>
      <stop offset=".55" stop-color="#a9d6e6"/>
      <stop offset="1" stop-color="#5f98d6"/>
    </radialGradient>
    <radialGradient id="botDeep" cx="0.5" cy="0.97" r="0.5">
      <stop offset="0" stop-color="#4f86d0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#4f86d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b73c6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3b73c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="cTop"><circle cx="512" cy="404" r="256"/></clipPath>
    <clipPath id="cBot"><circle cx="512" cy="620" r="256"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#03060f"/>
  <ellipse cx="512" cy="512" rx="470" ry="500" fill="url(#glow)"/>
  <!-- back sphere -->
  <g clip-path="url(#cBot)">
    <rect x="256" y="364" width="512" height="512" fill="url(#bot)"/>
    <rect x="256" y="364" width="512" height="512" fill="url(#botDeep)"/>
    <!-- the soft crease where the two spheres meet -->
    <ellipse cx="512" cy="590" rx="46" ry="120" fill="#4f86d0" opacity=".55" filter="url(#soft)"/>
  </g>
  <!-- front sphere -->
  <g clip-path="url(#cTop)">
    <rect x="256" y="148" width="512" height="512" fill="url(#top)"/>
    <rect x="256" y="148" width="512" height="512" fill="url(#topRim)"/>
    <ellipse cx="512" cy="640" rx="190" ry="40" fill="#5e91d6" opacity=".35" filter="url(#soft2)"/>
  </g>
</svg>
