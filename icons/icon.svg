<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-600" y="-600" width="2224" height="2224"><feGaussianBlur stdDeviation="64"/></filter>
    <filter id="f60" filterUnits="userSpaceOnUse" x="-600" y="-600" width="2224" height="2224"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="f40" filterUnits="userSpaceOnUse" x="-600" y="-600" width="2224" height="2224"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.9 -.4"/>
    </filter>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="900" y2="1024">
      <stop offset="0" stop-color="#050c30"/><stop offset=".22" stop-color="#1346b8"/><stop offset=".5" stop-color="#2a72f3"/><stop offset=".78" stop-color="#6fa7fa"/><stop offset="1" stop-color="#bcd6fd"/>
    </linearGradient>
    <radialGradient id="coreG"><stop offset="0" stop-color="#7ab0fc" stop-opacity=".7"/><stop offset=".6" stop-color="#7ab0fc" stop-opacity=".3"/><stop offset="1" stop-color="#7ab0fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="patchG"><stop offset="0" stop-color="#d3e6fe" stop-opacity=".95"/><stop offset=".25" stop-color="#d3e6fe" stop-opacity=".82"/><stop offset=".5" stop-color="#d3e6fe" stop-opacity=".5"/><stop offset=".75" stop-color="#d3e6fe" stop-opacity=".18"/><stop offset="1" stop-color="#d3e6fe" stop-opacity="0"/></radialGradient>
    <!-- the same blurred circle pinned to the right wall, now used as the shape the light is shown through -->
    <mask id="shape"><rect width="1024" height="1024" fill="#000"/><circle cx="1024" cy="512" r="500" fill="#fff" filter="url(#edge)"/></mask>
    <clipPath id="frame"><rect width="1024" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#02050c"/>
  <g clip-path="url(#frame)"><g mask="url(#shape)">
    <rect width="1024" height="1024" fill="url(#beam)"/>
    <ellipse cx="860" cy="360" rx="300" ry="470" fill="url(#coreG)"/>
    <g transform="rotate(-12 800 840)"><ellipse cx="800" cy="840" rx="520" ry="300" fill="url(#patchG)"/></g>
    <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:soft-light" opacity="0.9"/>
  </g></g>
</svg>
